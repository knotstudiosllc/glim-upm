name: Mirror Glim releases

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      all:
        description: "Mirror every missing upstream release (not just the latest)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upm branch and tags
        run: git fetch origin "+refs/heads/upm:refs/remotes/origin/upm" --tags || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/mirror.py --push --release ${{ inputs.all && '--all' || '' }}
